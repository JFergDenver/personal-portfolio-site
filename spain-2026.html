  <style>
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
      margin-top: 1.5rem;
    }

    .photo-grid figure {
      margin: 0;
      overflow: hidden;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      cursor: zoom-in;
      aspect-ratio: 4 / 3;
      background: var(--bg-alt);
    }

    .photo-grid figure img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .photo-grid figure:hover img {
      transform: scale(1.03);
      opacity: 0.92;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.88);
      padding: 1.5rem;
      z-index: 200;
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 6px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
    }

    .lightbox-close {
      position: absolute;
      top: 1rem;
      right: 1.25rem;
      background: none;
      border: none;
      color: #fff;
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.8;
    }

    .lightbox-close:hover {
      opacity: 1;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      font-size: 2rem;
      line-height: 1;
      padding: 0.5rem 0.8rem;
      cursor: pointer;
      border-radius: 4px;
    }

    .lightbox-nav:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .lightbox-prev { left: 1rem; }
    .lightbox-next { right: 1rem; }

    @media (min-width: 600px) {
      .photo-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }
    }
  </style>

  <script src="js/main.js"></script>
  <script>
    (function () {
      var figures = Array.from(document.querySelectorAll('#photo-grid figure'));
      var lightbox = document.getElementById('lightbox');
      var lightboxImg = document.getElementById('lightbox-img');
      var current = 0;

      function open(index) {
        current = index;
        var img = figures[current].querySelector('img');
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function close() {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
      }

      function prev() { open((current - 1 + figures.length) % figures.length); }
      function next() { open((current + 1) % figures.length); }

      figures.forEach(function (fig) {
        fig.addEventListener('click', function () { open(parseInt(fig.dataset.index, 10)); });
      });

      document.getElementById('lightbox-close').addEventListener('click', close);
      document.getElementById('lightbox-prev').addEventListener('click', function (e) { e.stopPropagation(); prev(); });
      document.getElementById('lightbox-next').addEventListener('click', function (e) { e.stopPropagation(); next(); });

      lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox || e.target === lightboxImg) close();
      });

      document.addEventListener('keydown', function (e) {
        if (!lightbox.classList.contains('open')) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowLeft') prev();
        if (e.key === 'ArrowRight') next();
      });
    })();
  </script>
